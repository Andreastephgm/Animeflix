<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <script src="https://kit.fontawesome.com/72a87f362c.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Luckiest+Guy&family=Patrick+Hand+SC&family=Ubuntu:wght@300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/AnimeFlix/styles/signin.css" />
</head>
<body>
  <header>
    <h2><strong>AnimeFlix</strong></h2>
    <nav class="nav1">
      <ul>
        <li><a href="./help.html">Help</a></li>
        <li><a href="./premium.html">Premium <i class="fa-solid fa-crown"></i></a></li>
      </ul>
    </nav>
  </header>

  <section>
    <h1>Sign In</h1>
    <form action="https://formspree.io/f/mblyzjeg" method="post">
        <label for="name">
          <div class="label-header">
            <i class="fa-solid fa-user"></i>
            <span>Name</span>
          </div>
          <input type="text" placeholder="Name" id="name" name="name" required />
        </label>
      
        <label for="email">
          <div class="label-header">
            <i class="fa-solid fa-envelope"></i>
            <span>Email</span>
          </div>
          <input type="email" placeholder="Email" id="email" name="email" required />
        </label>
      
        <label for="dateOfBirth">
          <div class="label-header">
            <i class="fa-solid fa-cake-candles"></i>
            <span>Date of Birth</span>
          </div>
          <input type="date" id="dateOfBirth" name="dateOfBirth" required />
        </label>
      
        <label for="password">
          <div class="label-header">
            <i class="fa-solid fa-lock"></i>
            <span>Password</span>
          </div>
          <input type="password" placeholder="Password" id="password" name="password" required />
        </label>
      
        <button type="submit">Register</button>
      </form>    
  </section>

  <script src="/AnimeFlix/scripts/signin.js"></script>
</body>
</html>
